name: Daily Market Report

# Runs every weekday after VN market close (15:30 VN = 08:30 UTC).
# Generates a markdown report via lmcli and commits to /docs/ so GitHub Pages
# can serve it for free. The /docs/latest.md is always overwritten; dated
# copies accumulate at /docs/reports/YYYY-MM-DD.md.

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 15:30 VN, Mon-Fri
  workflow_dispatch:           # manual trigger from Actions tab

permissions:
  contents: write              # to commit reports back

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum

      - name: Build lmcli
        working-directory: go
        run: go build -o /tmp/lmcli ./cmd/lmcli

      - name: Generate report
        id: report
        run: |
          mkdir -p docs/reports
          DATE=$(date -u +'%Y-%m-%d')
          OUT="docs/reports/${DATE}.md"
          /tmp/lmcli report --out="${OUT}"
          cp "${OUT}" docs/latest.md
          echo "date=${DATE}" >> "${GITHUB_OUTPUT}"
          echo "path=${OUT}" >> "${GITHUB_OUTPUT}"
          wc -l "${OUT}"

      - name: Generate landing page (index.html)
        run: |
          # Self-contained styled landing page that overrides Jekyll's
          # auto-rendered index.md. Includes today's data + features +
          # quick start + archive links.
          /tmp/lmcli html docs/index.html

      - name: Build archive list
        run: |
          # Tell Jekyll to skip auto-rendering index.md by removing it
          # (we have index.html now). Keep an archive list rendered from
          # reports/ so /reports/ has a nicer page.
          rm -f docs/index.md
          cd docs
          {
            echo "---"
            echo "title: Archive"
            echo "---"
            echo ""
            echo "# 🌸 lotusmarket — Daily Reports Archive"
            echo ""
            echo "Auto-generated reports for VN stock market. New report each weekday 15:30 VN."
            echo ""
            echo "[← Back to home](../)"
            echo ""
            ls -1r reports/*.md 2>/dev/null | head -90 | while read f; do
              name=$(basename "$f" .md)
              echo "- [${name}](${name}.html)"
            done
          } > reports/index.md

      - name: Commit + push
        run: |
          git config user.name "lotusmarket-bot"
          git config user.email "bot@lotusmarket.local"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(report): ${{ steps.report.outputs.date }} auto-generated"
          git push

      # Optional: post a Telegram-friendly summary to the public channel.
      # Uses `lmcli tg` (HTML-formatted compact summary) instead of the
      # markdown report — Telegram doesn't render markdown tables.
      # Step is skipped silently if either secret is missing.
      - name: Post summary to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          MESSAGE=$(/tmp/lmcli tg)
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL}" \
            --data-urlencode "text=${MESSAGE}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            > /dev/null
          echo "Posted to ${TELEGRAM_CHANNEL}"
