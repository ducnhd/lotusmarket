name: Auto Blog

# AI-generated blog post triggered by real market events (Mon-Fri post-close).
# lmcli marketscan detects VN30+HNX30 events, gates on a score threshold,
# deduplicates against recent posts, and falls back to evergreen backfill when
# no event clears the threshold and ≥3 days have passed since the last post.
# Output: docs/blog/YYYY-MM-DD-slug.md, committed to repo.
# Pi (lotusai-site) syncs via git pull cron.
# Telegram channel gets a short link summary.

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 16:00 VN (after 15:00 close), Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "auto-blog"
  cancel-in-progress: false

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum

      - name: Build lmcli
        working-directory: go
        run: go build -o /tmp/lmcli ./cmd/lmcli

      - name: Generate blog post
        id: gen
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "::error::CLAUDE_API_KEY secret not set"
            exit 1
          fi
          OUT=$(/tmp/lmcli marketscan --out docs/blog)
          if [ -z "$OUT" ]; then
            echo "no-event=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::marketscan produced no post today (no event, no backfill)"
            exit 0
          fi
          echo "path=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "filename=$(basename "$OUT")" >> "${GITHUB_OUTPUT}"
          echo "slug=$(basename "$OUT" .md)" >> "${GITHUB_OUTPUT}"
          echo "--- generated content (preview) ---"
          head -30 "$OUT"
          echo "..."
          wc -l "$OUT"

      - name: Quality gate (decide if post is broadcast-worthy)
        id: gate
        if: steps.gen.outputs.path != ''
        env:
          POSTPATH: ${{ steps.gen.outputs.path }}
        run: |
          # Pass gate iff body (excluding frontmatter) has:
          #   - length >= 1500 chars (substantive content)
          #   - no fail phrases ("không có data", "data hạn chế", etc.)
          #   - title isn't generic fallback "Ticker spotlight"
          BODY=$(awk '/^---$/{c++; next} c>=2' "$POSTPATH")
          LEN=$(printf "%s" "$BODY" | wc -c | tr -d ' ')
          # Phrases that signal the fallback "empty data" path Claude took
          # when the data builder returned nothing. "Data hạn chế" alone is
          # acceptable — it's a legitimate disclaimer Claude uses on specific
          # findings, not a full-blog fallback. We anchor on phrases that
          # only appear when the WHOLE blog is the meta "no data" fallback.
          FAIL_PHRASES="không có data, không có bài|data discipline quan trọng hơn bất kỳ|Khi Không Có Dữ Liệu|Live data không khả dụng tại thời điểm tạo bài"
          TITLE=$(grep -m1 '^title:' "$POSTPATH" | sed -E 's/^title: *"?([^"]*)"?$/\1/')

          PASS=true
          REASON=""
          if [ "$LEN" -lt 1500 ]; then
            PASS=false
            REASON="body too short ($LEN chars < 1500)"
          elif echo "$BODY" | grep -qiE "$FAIL_PHRASES"; then
            PASS=false
            REASON="contains fail phrase"
          elif [ "$TITLE" = "Ticker spotlight" ] || [ "$TITLE" = "Spotlight" ]; then
            PASS=false
            REASON="generic fallback title"
          fi

          echo "len=${LEN}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"
          if [ "$PASS" = "true" ]; then
            echo "broadcast=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Quality gate PASS (len=${LEN}, title=${TITLE})"
          else
            echo "broadcast=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Quality gate FAIL: ${REASON} — file kept in repo but skipping Telegram broadcast"
          fi

      - name: Commit + push
        if: steps.gen.outputs.path != ''
        run: |
          git config user.name "lotusmarket-bot"
          git config user.email "bot@lotusmarket.local"
          git add docs/blog/
          if git diff --cached --quiet; then
            echo "No new blog file"; exit 0
          fi
          git commit -m "blog: ${{ steps.gen.outputs.filename }} (auto-generated)"
          git push

      - name: Wait for deploy (Pi sync + GH Pages) before broadcasting
        if: steps.gen.outputs.path != '' && steps.gate.outputs.broadcast == 'true'
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          # Race fix: Telegram message would arrive before reader can open
          # the blog if Pi sync (every 1min cron) and GH Pages (1-3min build)
          # haven't caught up yet → 404. Poll both URLs until they return 200
          # or timeout (up to ~4 min) before posting.
          PI_URL="https://lotusai.servehttp.com/blog/${SLUG}"
          PAGES_URL="https://ducnhd.github.io/lotusmarket/blog/${SLUG}.html"

          wait_for() {
            local url="$1"; local label="$2"
            for i in $(seq 1 24); do
              if curl -fsS -o /dev/null --max-time 5 "$url"; then
                echo "${label} ready after $((i*10))s: $url"; return 0
              fi
              sleep 10
            done
            echo "::warning::${label} NOT ready after 240s — proceeding anyway: $url"
            return 1
          }
          wait_for "$PI_URL" "Pi (lotusai.servehttp.com)"
          wait_for "$PAGES_URL" "GitHub Pages"

      - name: Post link to Telegram
        if: steps.gen.outputs.path != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL != '' && steps.gate.outputs.broadcast == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SLUG: ${{ steps.gen.outputs.slug }}
          POSTPATH: ${{ steps.gen.outputs.path }}
        run: |
          # Extract title from frontmatter
          TITLE=$(grep -m1 '^title:' "$POSTPATH" | sed -E 's/^title: *"?([^"]*)"?$/\1/')
          # Extract TL;DR (first non-frontmatter, non-empty line that doesn't start with #)
          TLDR=$(awk '
            /^---$/ { f=!f; next }
            f { next }
            NF && !/^#/ && !/^[[:space:]]*$/ { print; exit }
          ' "$POSTPATH" | head -c 400)
          MESSAGE=$(printf "📝 <b>%s</b>\n\n%s\n\n📖 Đọc đầy đủ: https://lotusai.servehttp.com/blog/%s\n📊 Hoặc trên GitHub Pages: https://ducnhd.github.io/lotusmarket/blog/%s.html" \
            "$TITLE" "$TLDR" "$SLUG" "$SLUG")
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL}" \
            --data-urlencode "text=${MESSAGE}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            > /dev/null
          echo "Posted blog link to ${TELEGRAM_CHANNEL}"
