title: lotusmarket
description: Vietnamese Stock Market Toolkit — daily reports auto-generated from open-source library
theme: jekyll-theme-minimal
github:
  repository_url: https://github.com/ducnhd/lotusmarket
show_downloads: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - reports
exclude:
  - "*.md.bak"
  # Internal dev docs (design specs + implementation plans). They contain Go
  # code and GitHub Actions YAML with {{ }} / ${{ }} that break Jekyll's Liquid
  # parser, and they are not site content.
  - superpowers
